name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: instala uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: instala deps
        run: uv sync --frozen

      - name: lint (ruff check)
        run: uv run ruff check --output-format=github

      - name: format (ruff format --check)
        run: uv run ruff format --check

      - name: tipos (mypy)
        run: uv run mypy

      - name: hooks do prek
        run: uv run prek run --all-files --show-diff-on-failure

      # O dump de 423 MB não entra na CI. Os testes que dependem dos parquets
      # do pipeline dão skip sozinhos quando o artefato não existe, e o resto
      # roda contra fixture. Ver CONTRIBUTING.md, seção "O que a CI cobre".
      - name: testes
        run: uv run pytest -q
