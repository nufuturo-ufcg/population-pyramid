# Parâmetros do método. Tudo que é ambíguo nos artigos está aqui, explícito,
# com a citação da fonte. Constante enterrada no código está proibida.

# ---------------------------------------------------------------------------
# ENTRADA. De onde vêm os eventos e o que a saída conta como uma população.
# ---------------------------------------------------------------------------
input:
  # Pasta em adapters/. O adaptador traduz a origem para o formato canônico de
  # eventos (adapters/<nome>/source.py, contrato em src/pyramid/sources/base.py).
  adapter: msr14

# Qual fonte de dados é a da replicação publicada.
output:
  # O adaptador nomeado aqui é o que `config/checkpoints.yaml` descreve, e isso
  # decide duas coisas:
  #
  # 1. Ele grava na raiz de `output/<estágio>/`. Todos os outros ganham
  #    `output/<adaptador>/<estágio>/`. Dois adaptadores numeram escopo de
  #    jeitos diferentes, então os parquets não se sobrescrevem: eles convivem,
  #    e `_ids_gravados` empilha as duas populações como se fossem uma. O modo
  #    de falha é pirâmide de gente que nunca esteve junta, sem erro nenhum.
  #
  # 2. Só ele produz as figuras de réplica dos artigos. A composição de cada
  #    painel vem de `checkpoints.yaml: figures`, com projeto e data fixos do
  #    dump MSR14, e essas figuras não existem para outro dataset.
  #
  # O msr14 está aqui porque a replicação foi publicada nesses caminhos e os
  # docs embutem as figuras. Mover a saída dele reescreveria o histórico do diff.
  adapter_da_replicacao: msr14

analysis:
  # Unidade de análise da pirâmide: uma pirâmide por quê.
  #   project   -> uma população por escopo do adaptador (é o que os dois artigos fazem)
  #   language  -> soma os escopos que compartilham `scope_meta.language`
  #
  # `language` responde "quem escreve Clojure", somando os N repositórios da
  # linguagem. A soma acontece no `extract`, antes do `classify`, porque é o
  # `profile` que decide quem nasceu quando: somando pirâmides prontas, quem
  # mexe em cinco repositórios vira cinco pessoas, cada uma nascendo na estreia
  # do repositório dela. Quem agrupa é `src/pyramid/units.py`.
  unit: project

# As três chaves abaixo descrevem o recorte de projetos DO ADAPTADOR MSR14.
# Trocar de adaptador troca o significado delas junto.
projects:
  # 91 linhas têm forked_from IS NULL; a 108342 (Craftbukkit/Bukkit) é um
  # namespace fantasma com zero atividade e language NULL. A exclusão é por ID
  # explícito. `language IS NOT NULL` derrubaria a mesma linha por coincidência
  # dos dados, sem dizer nada sobre o critério.
  root_filter: "forked_from IS NULL"
  exclude_ids: [108342]
  expected_count: 90

  # ATENÇÃO: `symfony` resolve pra DOIS roots: 51671 symfony/symfony e
  # 74915 xphere-forks/symfony (fork não rotulado). Busca por nome é
  # não-determinística; checkpoints.yaml sempre usa ID.

# ---------------------------------------------------------------------------
# AMBIGUIDADE 1: taxonomia de eventos.
# O IEICE16 se contradiz na mesma página 1307:
#   * Tabela 1  -> `issues` = non-coding, `issues_events` = "excluded in this study"
#   * a prosa   -> `issue_events` = non-coding, `issues` nem é mencionado
# As duas leituras dão exatamente "six development activities". O Apêndice A
# ("based on the classification of the activities as shown in Table 1") aponta
# pra Tabela 1. O ESEM14 seção 3 concorda com a PROSA.
# Rodamos as duas e deixamos os Tipos A-D decidirem.
# ---------------------------------------------------------------------------
taxonomy:
  variant: prose   # table1 | prose

  variants:
    table1:
      source: "IEICE16 Tabela 1, p.1307 (+ Apêndice A)"
      coding: [commits, pull_requests]
      non_coding: [commit_comments, issues, issue_comments, pull_request_comments]
      excluded: [issue_events]
    prose:
      source: "IEICE16 p.1307 prosa == ESEM14 seção 3"
      coding: [commits, pull_requests]
      non_coding: [commit_comments, issue_comments, pull_request_comments, issue_events]
      excluded: [issues]
    # Isto é teste de limite, sem leitura do artigo. A seção 28 mostrou que em 3 dos 4
    # painéis da Fig.2 nossa primeira atividade cai MAIS TARDE que a dos
    # autores. `issues.created_at` (abertura) é a âncora mais antiga que o dump
    # oferece e é a única que `prose` deixa de fora. `union` liga tudo ao mesmo
    # tempo: se nem assim a idade recuar o bastante, a hipótese "faltava um tipo
    # de evento" morre. Ver docs/replicacao/discrepancias.md seção 29.
    union:
      source: "teste de limite (seção 29), sem leitura do artigo"
      coding: [commits, pull_requests]
      non_coding: [commit_comments, issues, issue_comments, pull_request_comments, issue_events]
      excluded: []

# ---------------------------------------------------------------------------
# AMBIGUIDADE 2: escopo de commits. Ver docs/replicacao/discrepancias.md, seção 2.
# Medido em dez/2011 para homebrew, entre contribuidores ATIVOS (que é o que a
# pirâmide mostra): root=1446, family_project_commits=1479, family_project_id=1480.
# Diferença de ~2%. Em contagem cumulativa daria 45%, mas cumulativo não é usado
# em lugar nenhum do método. Risco baixo; começamos pelo mais simples.
# ---------------------------------------------------------------------------
commit_scope: root   # root | family_project_commits | family_project_id

# ---------------------------------------------------------------------------
# AMBIGUIDADE 6: identidade. O GHTorrent abre uma linha em `users` por
# identidade que consegue resolver, e a MESMA pessoa costuma ter uma conta
# "cheia" mais satelites de 1-5 eventos (e-mail de commit que ele nao casou com
# a conta do GitHub). Sem fundir, a piramide conta a pessoa N vezes E a
# rejuvenesce: cada satelite tem primeiro-evento proprio. Medido: clojure tem 6
# grupos por nome completo (9 ids a menos), blueprint-css 1 (o dono),
# paperclip 18, homebrew 291. Ver discrepancias.md seção 26.
#   none        -> um user.id = uma pessoa (comportamento ate s25)
#   email       -> funde por users.email (seguro; so 3 pares nos 4 projetos)
#   email_name  -> email + users.name com >=2 tokens fora da lista de nomes
#                  vazios. Pega o volume, mas admite falso positivo (dois
#                  "david miller" de verdade viram um).
identity_merge: none

periods:
  # "we consider that a contributor left a project when he/she did not give any
  #  contribution on that project for more than three months" (IEICE16 p.1306)
  inactivity_months: 3

  # "we make software population pyramids with three months groups" (p.1306)
  band_months: 3

  # Largura da banda EM DIAS, para cortar a idade. Não é `band_months` × 365.25/12
  # (= 91.3125). É 90, mês de 30 dias. Isso foi medido, com erro L1
  # do frame contra os pixels da Fig.2 do ESEM14, nos quatro projetos, varrendo
  # a largura da banda e a janela da pirâmide (ver `discrepancias.md` seção 21):
  #
  #     banda 90.0000d  janela 365.25d  ->  L1 = 437   blueprint-css = 0 (exato)
  #     banda 91.3125d  janela 365.25d  ->  L1 = 481   blueprint-css = 2
  #
  # 90 ganha em TODA janela testada (360, 364, 365, 365.25, 366, 370), e no
  # blueprint-css zera: as seis bandas do artigo batem uma a uma, incluindo o
  # buraco na banda 3 e o topo na 15. Com 91.3125 esse contribuidor cai na
  # banda 3 e o buraco some. É o "quadrado sem espaço vazio" que o desenho
  # denunciava. Mesma coisa no paperclip: com 90 o topo vai para a banda 15 e o
  # eixo mostra "4 years", como no artigo.
  #
  # O incômodo é real e fica registrado: a janela de 12 meses da pirâmide segue
  # valendo 365.25 dias (com 360 o blueprint-css DESencaixa). Ou seja, o artigo
  # não usa um mês só. Não unificar por gosto de simetria: o dado manda.
  band_days: 90

  # "we define newcomers as contributors who have less than three months of
  #  activity periods" (p.1308)
  newcomer_max_months: 3

  # AMBIGUIDADE 3: o que é a "idade" do contribuidor.
  #
  #  accumulated_active  soma dos períodos de atividade (leitura literal de
  #                      "less than three months of ACTIVITY PERIODS", p.1308)
  #  calendar_tenure     tempo desde a origem, gaps não descontam (leitura
  #                      demográfica: numa pirâmide etária idade é idade)
  #
  # Medido nos Tipos A-D de set/2013 (esperado 23/42/18/3):
  #   accumulated_active -> 41/42/ 0/ 0   erro L1 = 62   <- C e D VAZIOS
  #   calendar_tenure    -> 27/39/14/ 3   erro L1 = 11
  #
  # accumulated_active é impossível: o artigo tem 21 projetos em C+D e essa
  # leitura não produz nenhum. Some com quase todo mundo experiente porque
  # ninguém acumula 3 meses de atividade contínua. Fica `calendar_tenure`,
  # que é também o que o método demográfico emprestado exige. Ver
  # docs/replicacao/discrepancias.md seção 3.
  age_basis: calendar_tenure   # calendar_tenure | accumulated_active

snapshots:
  # Série trimestral cobrindo o dataset. Fim da cobertura é 2013-10-06, mas
  # issue_comments vai até 2013-10-07. O corte em 2013-09-30 fica antes dos dois.
  start: "2010-03-31"
  end: "2013-09-30"
  freq_months: 3
  classification_snapshot: "2013-09-30"   # Fig.5 / Tipos A-D
  # ATENÇÃO: estas datas têm de existir na série gerada por start/freq_months.
  # A série é ancorada em fim de trimestre CIVIL (QuarterEnd), então dez cai em
  # -12-31 e mar em -03-31. Até 2026-08 usava DateOffset(months=3) acumulado, que
  # grudava tudo no dia 30 a partir do primeiro mês curto. Ver seção 8 de
  # docs/replicacao/discrepancias.md. snapshots.py valida e falha alto se não casar.
  projection_base: ["2013-03-31", "2013-06-30"]
  projection_target: "2013-09-30"

metrics:
  # CCR = (coding-non)/coding se coding>=non, senão (coding-non)/non   [p.1308]
  # NCR = (new-exp)/new       se new>=exp,      senão (new-exp)/exp    [p.1308]
  # Corte é ZERO. A mediana foi testada e refutada. `coding` inclui os `moved`.
  threshold: 0.0
  coding_includes_moved: true

  # Quadrantes (IEICE16 p.1309, descritos em palavras, não em sinal):
  #   A: mais newcomers + mais coding      -> CCR > 0, NCR > 0
  #   B: mais newcomers + mais non-coding  -> CCR < 0, NCR > 0
  #   C: mais experientes + mais coding    -> CCR > 0, NCR < 0
  #   D: mais experientes + mais non-coding-> CCR < 0, NCR < 0
  # Empate exato (CCR ou NCR == 0) o artigo não cobre. Regra fixa no código:
  # alto = (valor > 0), então zero cai do lado baixo. Não é configurável de
  # propósito. Ver docstring de metrics._type_of e docs/replicacao/discrepancias.md.

projection:
  # "the 36 projects that have more than 100 contributors" (p.1311). O artigo
  # NÃO diz se é cumulativo ou ativo, nem sobre qual snapshot. Grid completo
  # medido em docs/replicacao/discrepancias.md seção 7: nenhuma combinação dá 36.
  # Melhor variante = base mar/2013, todos os contribuidores ativos -> 35.
  # O 36º candidato tem 96 ativos (corte cai entre 102 e 96), então é ruído de
  # fronteira, não erro de método. Aceito: ABRE/Wilcoxon não dependem do n exato.
  min_contributors: 100
  min_contributors_basis: active   # active | cumulative
  # Verbatim do PDF (IEICE16 p.1311, citando Miyazaki et al. [19]):
  #   MRE  = |x - x̂| / x
  #   MER  = |x - x̂| / x̂
  #   ABRE = |x̂ - x| / x   se (x̂ - x >= 0)
  #        = |x̂ - x| / x̂  se (x̂ - x <  0)
  # Nos dois ramos o denominador é o MENOR entre x e x̂, daí `min`. A seção 5 das
  # instruções e o plano-replicação.docx concordam com isto; conferido no PDF.
  abre_denominator: min

attractiveness:
  # ESEM14 seção 3.1, base Yamashita et al. MSR'14. Só commits e pull requests.
  events: [commits, pull_requests]
  cutoff: median          # recalculada ano a ano
  # "mais de 10 desenvolvedores ativos" -> comparação ESTRITA (devs > 10).
  min_active_devs: 10

  # AMBIGUIDADE 4: "os contribuidores do projeto naquele ano que também
  # contribuíram no ano seguinte": no MESMO projeto ou em qualquer lugar?
  #
  #  project  volta ao mesmo projeto. É o que o Yamashita mede: "sticky" é o
  #           projeto segurar o dev; um projeto não fica sticky porque o dev
  #           foi embora e passou a commitar em outro lugar.
  #  dataset  volta a qualquer projeto dos 90. Só serve para medir o tamanho
  #           da ambiguidade; infla stickiness de todo mundo.
  stickiness_scope: project   # project | dataset

plots:
  # AMBIGUIDADE 5: que população a PIRÂMIDE desenha.
  #
  #  stock   todo mundo que já contribuiu até o snapshot, posicionado pela
  #          idade acumulada. Quem entrou em 2007 e parou em 2010 continua
  #          na figura de 2011, na banda de idade que alcançou.
  #  active  só quem tem contribuição nos últimos `inactivity_months`, a
  #          mesma população que `metrics` usa para CCR/NCR.
  #
  # `stock` FOI DESCARTADO. Ver docs/replicacao/discrepancias.md seção 18 (superada) e seção 19.
  # O texto do ESEM14 é explícito: contribuidores "end when they leave the
  # development communities", e a legenda da Fig.1 conta DOIS contribuidores em
  # t1 de três desenhados. O developer 2, cujo período já acabou, fica fora.
  # Quem entrou em 2007 e parou em 2010 não está na figura de 2011.
  # Empiricamente, o estoque enche as bandas 9, 10 e 11 do blueprint-css, que
  # na Fig.2 estão vazias (teste do buraco, seção 19). Esse teste não depende de
  # escala, ao contrário do argumento de barra que motivou a escolha anterior.
  #
  # Isto NÃO contamina CCR/NCR: `metrics` filtra `active` por conta própria
  # (metrics.py:111) e segue batendo 48/55.
  pyramid_population: active   # stock | active

  # JANELA da população da pirâmide, em meses (seção 19, FECHADA).
  #
  # Não é mais um chute: as barras da Fig.2 do ESEM14 foram MEDIDAS em pixel
  # (eixo calibrado pelas linhas de grade: 750/500/250 no homebrew, 100/50 no
  # paperclip, 10/5 no clojure, 5 no blueprint-css) e comparadas banda a banda
  # com a replicação em 2011-12-31, varrendo a janela em 3/6/9/12/18/24/∞ meses.
  # 12 meses minimiza o erro L1 nos QUATRO painéis ao mesmo tempo:
  #
  #   janela |  3m   6m   9m  12m  18m  24m   ∞
  #   homebrew  2560 1369  747  328  594  799  855
  #   paperclip  355  203   69   33  181  268  364
  #   clojure     26   18   14   10   25   34   49
  #   blueprint   12    5    1    2    3    4   23
  #
  # Totais em 12m: 3882/524/49/13 contra 3946/535/47/13 medidos (a medição lê
  # ~2% a mais, é a borda preta da barra). A 3 meses o blueprint-css desaba
  # para UM contribuidor; a ∞ (estoque) reaparecem as bandas 16-17 que a figura
  # não tem. Ver docs/replicacao/discrepancias.md seção 19.
  #
  # Leitura substantiva: com snapshot em fim de ano, "janela de 12 meses" é
  # "quem contribuiu durante o ano do snapshot". A pirâmide anual conta a
  # população do ANO, não a do trimestre. O `inactivity_months: 3` do
  # MSR14/IEICE16 continua valendo onde o artigo o crava: quebra de períodos
  # em `classify` e população de CCR/NCR em `metrics`.
  pyramid_window_months: 12
