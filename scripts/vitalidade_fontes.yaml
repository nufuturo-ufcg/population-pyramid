# Onde estão os eventos brutos de cada linguagem. Caminhos da batuta
# (wendell@batuta.splab.ufcg.edu.br), onde os dados ficam. Nada é movido nem copiado:
# a ferramenta lê de lá. Outro lugar, na linha de comando:
#
#     --dados PASTA                       pasta com eventos_api.csv + eventos_git.csv (ou o
#                                         arquivo único) e repositorios_<linguagem>_alvo.csv
#     --eventos ARQUIVO --alvo ARQUIVO    cada um repetível; o papel vem do nome do arquivo
#
# Papel de um arquivo de eventos (pelo nome, ou `papel:` aqui): `api` (_api no nome),
# `git` (_git no nome) ou `misto` (api e git no mesmo arquivo).
#
# `pasta:` procura na pasta eventos_api.csv + eventos_git.csv (senão o arquivo único) e
# repositorios_<linguagem>_alvo.csv. Use `eventos:` e `alvos:` quando os arquivos estão
# em pastas diferentes, como no Python.
#
# `autores:` é o autores_commits.csv da coleta de autores (coleta-dados/scripts/autores_commits.py):
# liga o e-mail de cada autor de commit à conta do GitHub. Com ele, o commit conta para o login da
# pessoa (regra 8 de adapters/coleta_csv/carga_duckdb.py) e a carga usa o motor duckdb.
#
# `duplicados:` é o repos_excluidos.csv que scripts/auditoria_repos.py gera: repositórios com outro
# repo_id e as mesmas issues e PRs de um repositório que fica. Só vale com `sem_duplicados: true`.
#
# `fracoes_api:` é o CSV de `scripts/granularidade/consulta_languages.py`: a fração da linguagem pela API do GitHub
# para os candidatos com `languages` vazia na SEART (a regra de elegibilidade fica em `carga_fonte.py`).
# `sem_linhas_repetidas:` tira da carga a linha repetida do bruto (chave: todas as colunas menos `collection_started_at`).
# `leitura_sequencial:` lê o CSV com um fio só (`parallel=false`), porque a leitura paralela do duckdb perde linhas em campos
# com aspas e quebras de linha. Python com leitura sequencial pede 56GB de memória.

linguagens:
  python:
    # Arquivo final da junção de 4 coletas (344 GB). A ordem da junção está no
    # MANIFESTO.txt da mesma pasta. Cada parte tem o próprio alvo: juntos somam os
    # 422.720 repositórios candidatos.
    eventos:
      - /home/wendell/dados-brutos/python/python-completo/eventos_python.csv
      # Eventos de 4 repositórios recuperados em 2026-11-23 (os 126 sem evento); só 2 são elegíveis.
      - /home/wendell/pyramid/correcao-elegibilidade/coleta-126/eventos_repositorios.csv
    alvos:
      - /home/wendell/dados-brutos/python/run-aws-1/repositorios_python_alvo.csv
      - /home/wendell/dados-brutos/python/run-vm2-1/repositorios_python_alvo.csv
      - /home/wendell/dados-brutos/python/run-batuta-1/repositorios_python_alvo.csv
      - /home/wendell/dados-brutos/python/run-batuta-2/repositorios_python_alvo.csv
    autores: /home/wendell/dados-brutos/autores/python/autores_commits_completo.csv
    duplicados: /home/wendell/dados-brutos/duplicados/python.csv
    # Fração de Python pela API do GitHub para os candidatos com `languages` vazia na SEART.
    fracoes_api: /home/wendell/pyramid/correcao-elegibilidade/consulta_languages.csv
    sem_linhas_repetidas: true
    leitura_sequencial: true
  clojure:
