# Onde estão os eventos brutos de cada linguagem. Caminhos da batuta
# (wendell@batuta.splab.ufcg.edu.br), onde os dados ficam. Nada é movido nem copiado:
# a ferramenta lê de lá. Outro lugar, na linha de comando:
#
#     --dados PASTA                       pasta com eventos_api.csv + eventos_git.csv (ou o
#                                         arquivo único) e repositorios_<linguagem>_alvo.csv
#     --eventos ARQUIVO --alvo ARQUIVO    cada um repetível; o papel vem do nome do arquivo
#
# Papel de um arquivo de eventos (pelo nome, ou `papel:` aqui): `api` (_api no nome),
# `git` (_git no nome) ou `misto` (api e git no mesmo arquivo).
#
# `pasta:` procura na pasta eventos_api.csv + eventos_git.csv (senão o arquivo único) e
# repositorios_<linguagem>_alvo.csv. Use `eventos:` e `alvos:` quando os arquivos estão
# em pastas diferentes, como no Python.

linguagens:
  python:
    # Arquivo final da junção de 4 coletas (344 GB). A ordem da junção está no
    # MANIFESTO.txt da mesma pasta. Cada parte tem o próprio alvo: juntos somam os
    # 422.720 repositórios candidatos.
    eventos:
      - /home/wendell/dados-brutos/python/python-completo/eventos_python.csv
    alvos:
      - /home/wendell/dados-brutos/python/run-aws-1/repositorios_python_alvo.csv
