[project]
name = "pyramid"
version = "0.1.0"
description = "Replicação de Onoue et al. — pirâmides de população de software (ESEM14 / IEICE16)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pyarrow>=16.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "scipy>=1.13",
    "python-dotenv>=1.0",
]

[project.scripts]
pyramid = "pyramid.cli:app"

[dependency-groups]
dev = [
    "pypdf>=6.14.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyramid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "checkpoint: compara com número/rótulo publicado nos papers (exige os parquets gerados)",
]
